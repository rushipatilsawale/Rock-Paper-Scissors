<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="header">
        <h1 class="heading">Rock Paper Scissors</h1>
    </div>

    <div class="container">
        <div class="game">
            <div class="buttons">
                <button class="btn" id="rock"><i class="fa-regular fa-hand-back-fist"></i></button>
                <button class="btn" id="paper"><i class="fa-regular fa-hand-spock"></i></button>
                <button class="btn" id="scissors"><i class="fa-regular fa-hand-peace"></i></button>
            </div>

            <div class="records">
                <div class="record" id="record1">
                    <div id="user-score">0</div>
                    <div id="player">You</div>
                </div>

                <div class="record" id="record2">
                    <div id="comp-score">0</div>
                    <div id="player">Comp</div>
                </div>
            </div>

            <div class="msg-container">
                <div class="msg">Pick your move</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
